  <path d="M132 150 C200 128 312 128 380 150 C402 215 402 297 380 362 C312 384 200 384 132 362 C110 297 110 215 132 150 Z" fill="url(#gold)" stroke="url(#goldEdge)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M132 150 C200 128 312 128 380 150 C402 215 402 297 380 362 C312 384 200 384 132 362 C110 297 110 215 132 150 Z" fill="url(#puff)"/>
  <!-- plis aux quatre coins -->
