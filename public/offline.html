<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1118" />
  <title>Pillow — hors ligne</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #faf6f2; color: #2a1b26; text-align: center;
    }
    @media (prefers-color-scheme: dark) { body { background: #150e14; color: #f6ebe6; } }
    img { width: 88px; height: 88px; border-radius: 24px; box-shadow: 0 12px 32px rgba(180, 69, 111, .25); }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 2rem; margin: 20px 0 6px; font-weight: 600; }
    p { margin: 0 auto 20px; max-width: 28ch; opacity: .75; line-height: 1.5; }
    button {
      border: 0; border-radius: 999px; padding: 12px 26px; font-size: 1rem; font-weight: 600; cursor: pointer;
      background: linear-gradient(135deg, #c85582, #a63a64); color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Pillow" />
    <h1>Tu es hors ligne</h1>
    <p>Pillow se reconnectera dès que le réseau sera de retour. Tes rappels continuent d'arriver.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
